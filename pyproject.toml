[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cv-as-code"
version = "0.1.0.dev0"
description = "Fact-grounded CV generation: verified facts -> LLM-drafted spec -> human gate -> deterministic PDF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Emanuele Partenza" }]
keywords = ["cv", "resume", "typst", "llm", "data-lineage", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.17",
  "pypdf>=4.0",
  "typst>=0.15,<0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
cvac = "cv_as_code.cli:main"

[project.urls]
Repository = "https://github.com/EmanuelePartenza/cv-as-code"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_as_code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
