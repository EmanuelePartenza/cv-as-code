stage: 70_interview_prep
version: 1
engine: llm
gate: none
output_language: pivot
params: [user, job_id]
inputs:
  - path: jobs/{job_id}/job.yaml
  - path: users/{user}/matches/{job_id}.yaml
  - path: users/{user}/applications/{job_id}/cv-spec.yaml
  - path: users/{user}/profile.yaml
  - path: users/{user}/search.yaml
output:
  path: users/{user}/applications/{job_id}/interview-prep.md
  format: markdown-frontmatter
  schema: interview-prep.schema.json
