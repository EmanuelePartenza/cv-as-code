stage: 03_extract
version: 1
engine: llm
gate: none
output_language: pivot
params: [user, document, name]
inputs:
  - path: users/{user}/{document}
  - path: users/{user}/profile.yaml
    optional: true
output:
  path: users/{user}/notes/{name}.md
  format: markdown-frontmatter
  schema: evidence.schema.json
