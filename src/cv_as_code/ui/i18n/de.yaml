# UI chrome, German. Keys are the English strings (ADR-0016).
'A master CV from your confirmed facts, then postings: match, tailored CV, letter, interview preparation, gap plan.': 'Ein Master-Lebenslauf aus Ihren bestätigten Fakten, dann Stellenanzeigen: Abgleich, zugeschnittener Lebenslauf, Anschreiben, Gesprächsvorbereitung, Lückenplan.'
? A posting enters verbatim as jobs/<id>/raw.txt; every step after that is a stage run by Claude and checked by the validator.
: Eine Stellenanzeige kommt wörtlich nach jobs/<id>/raw.txt; jeder weitere Schritt ist eine Stufe, die Claude ausführt und der Validator prüft.
Add a posting: Stellenanzeige hinzufügen
Add another: 'Hinzufügen:'
? Answer in your own words and language, as plainly as you like; "I do not know" is a valid answer. Save whenever you want and come back later. Nothing here reaches a CV before you have confirmed it, fact by fact.
: Antworten Sie mit eigenen Worten und in Ihrer Sprache, so schlicht Sie wollen; „weiß ich nicht“ ist eine gültige Antwort. Speichern Sie, wann Sie wollen, und kommen Sie später zurück. Nichts hier gelangt in einen Lebenslauf, bevor Sie es Fakt für Fakt bestätigt haben.
Apply to the profile (04): Ins Profil übernehmen (04)
? 'Applying a note is deterministic: its facts are appended to profile.yaml as draft, each pointing at its passage, and nothing else in the file moves; nothing becomes verified here.'
: 'Das Übernehmen einer Notiz ist deterministisch: ihre Fakten werden als Entwurf an profile.yaml angehängt, jeder mit Verweis auf seine Textstelle, und sonst bewegt sich nichts in der Datei; nichts wird hier verifiziert.'
