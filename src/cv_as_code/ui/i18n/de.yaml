? 'Everything about you in one place: what your documents proposed (to confirm) and what you add yourself. Only confirmed facts reach a CV; the AI drafts CVs and letters from this page and nothing else.'
: 'Alles über Sie an einem Ort: was Ihre Dokumente vorgeschlagen haben (zu bestätigen) und was Sie selbst hinzufügen. Nur bestätigte Fakten gelangen in einen Lebenslauf; die KI entwirft Lebensläufe und Anschreiben aus dieser Seite und aus nichts anderem.'
