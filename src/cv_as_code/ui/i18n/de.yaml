? Extraction proposes the facts and applies them to your profile as drafts; the document is then archived under sources/. You confirm each fact in the Review area.
: Die Extraktion schlägt die Fakten vor und übernimmt sie als Entwürfe in Ihr Profil; das Dokument wird dann unter sources/ archiviert. Jeden Fakt bestätigen Sie im Bereich Prüfung.
Facts: Fakten
? 'Facts enter the profile from documents: a filled questionnaire, an old CV, a review. Claude extracts them into an evidence note with the passage each fact rests on; they land as draft and you verify them on the profile.'
: 'Fakten gelangen aus Dokumenten ins Profil: ein ausgefüllter Fragebogen, ein alter Lebenslauf, eine Beurteilung. Claude extrahiert sie in eine Belegnotiz mit der Textstelle, auf der jeder Fakt beruht; sie landen als Entwurf und Sie verifizieren sie im Profil.'
Folder name: Ordnername
? Four doors, in any order and at any time. Everything you enter stays in your data folder; nothing becomes part of a CV before you have confirmed it, fact by fact.
: Vier Türen, in beliebiger Reihenfolge und zu jeder Zeit. Alles, was Sie eingeben, bleibt in Ihrem Datenordner; nichts wird Teil eines Lebenslaufs, bevor Sie es Fakt für Fakt bestätigt haben.
