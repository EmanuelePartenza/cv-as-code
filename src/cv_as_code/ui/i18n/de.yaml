? 'Each fact below was proposed from one of your documents or answers. Read it next to its passage: confirm it if the passage says what the fact says, reword it if the wording is off, reject it if it is not true or not yours. Rejected facts are kept, never deleted.'
: 'Jeder Fakt unten wurde aus einem Ihrer Dokumente oder Ihrer Antworten vorgeschlagen. Lesen Sie ihn neben seiner Textstelle: bestätigen Sie ihn, wenn die Stelle sagt, was der Fakt sagt; formulieren Sie ihn um, wenn die Worte nicht passen; lehnen Sie ihn ab, wenn er nicht stimmt oder nicht Ihrer ist. Abgelehnte Fakten bleiben erhalten, sie werden nie gelöscht.'
? Each run is Claude Code in print mode inside your data root, with file tools only; the result counts only if it validates. Approval of the CV and the letter stays on their page.
: Jeder Lauf ist Claude Code im Print-Modus in Ihrem Datenordner, nur mit Dateiwerkzeugen; das Ergebnis zählt nur, wenn es validiert. Die Freigabe von Lebenslauf und Anschreiben bleibt auf deren Seite.
