? 'Each fact below was proposed from one of your documents or answers. Read it next to its passage: confirm it if the passage says what the fact says, reword it if the wording is off, reject it if it is not true or not yours. Rejected facts are kept, never deleted.'
: 'Chaque fait ci-dessous a été proposé à partir d''un de vos documents ou de vos réponses. Lisez-le à côté de son passage : confirmez-le si le passage dit ce que dit le fait, reformulez-le si les mots ne conviennent pas, rejetez-le s''il n''est pas vrai ou pas le vôtre. Les faits rejetés sont conservés, jamais supprimés.'
? Each run is Claude Code in print mode inside your data root, with file tools only; the result counts only if it validates. Approval of the CV and the letter stays on their page.
: Chaque exécution est Claude Code en mode print dans votre dossier de données, avec des outils fichiers seulement ; le résultat ne compte que s'il valide. L'approbation du CV et de la lettre reste sur leur page.
