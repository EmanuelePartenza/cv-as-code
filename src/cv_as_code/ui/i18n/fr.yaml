# UI chrome, French. Keys are the English strings (ADR-0016).
'A master CV from your confirmed facts, then postings: match, tailored CV, letter, interview preparation, gap plan.': 'Un CV master à partir de vos faits confirmés, puis les annonces : correspondance, CV adapté, lettre, préparation d''entretien, plan de comblement des lacunes.'
? A posting enters verbatim as jobs/<id>/raw.txt; every step after that is a stage run by Claude and checked by the validator.
: Une annonce entre telle quelle dans jobs/<id>/raw.txt ; chaque étape suivante est un stade exécuté par Claude et contrôlé par le validateur.
Add a posting: Ajouter une annonce
Add another: 'Ajouter :'
? Answer in your own words and language, as plainly as you like; "I do not know" is a valid answer. Save whenever you want and come back later. Nothing here reaches a CV before you have confirmed it, fact by fact.
: Répondez avec vos mots et dans votre langue, aussi simplement que vous voulez ; « je ne sais pas » est une réponse valable. Enregistrez quand vous voulez et revenez plus tard. Rien ici n'atteint un CV avant que vous l'ayez confirmé, fait par fait.
Apply to the profile (04): Appliquer au profil (04)
? 'Applying a note is deterministic: its facts are appended to profile.yaml as draft, each pointing at its passage, and nothing else in the file moves; nothing becomes verified here.'
: 'Appliquer une note est déterministe : ses faits sont ajoutés à profile.yaml en brouillon, chacun pointant vers son passage, et rien d''autre ne bouge dans le fichier ; rien ne devient vérifié ici.'
