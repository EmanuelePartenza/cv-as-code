? Extraction proposes the facts and applies them to your profile as drafts; the document is then archived under sources/. You confirm each fact in the Review area.
: L'extraction propose les faits et les applique à votre profil en brouillon ; le document est ensuite archivé sous sources/. Vous confirmez chaque fait dans la zone Revue.
Facts: Faits
? 'Facts enter the profile from documents: a filled questionnaire, an old CV, a review. Claude extracts them into an evidence note with the passage each fact rests on; they land as draft and you verify them on the profile.'
: 'Les faits entrent dans le profil par des documents : un questionnaire rempli, un ancien CV, une évaluation. Claude les extrait dans une note de preuve avec le passage sur lequel chaque fait repose ; ils arrivent en brouillon et vous les vérifiez sur le profil.'
Folder name: Nom du dossier
? Four doors, in any order and at any time. Everything you enter stays in your data folder; nothing becomes part of a CV before you have confirmed it, fact by fact.
: Quatre portes, dans n'importe quel ordre et à tout moment. Tout ce que vous saisissez reste dans votre dossier de données ; rien n'entre dans un CV avant que vous l'ayez confirmé, fait par fait.
