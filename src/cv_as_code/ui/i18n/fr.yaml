'A master CV from your confirmed facts, then postings: match, tailored CV, letter, interview preparation, gap plan.': 'Un CV master à partir de vos faits confirmés, puis les annonces : correspondance, CV adapté, lettre, préparation d''entretien, plan de comblement des lacunes.'
? A posting enters verbatim as jobs/<id>/raw.txt; every step after that is a stage run by Claude and checked by the validator.
: Une annonce entre telle quelle dans jobs/<id>/raw.txt ; chaque étape suivante est un stade exécuté par Claude et contrôlé par le validateur.
