? 'Each fact below was proposed from one of your documents or answers. Read it next to its passage: confirm it if the passage says what the fact says, reword it if the wording is off, reject it if it is not true or not yours. Rejected facts are kept, never deleted.'
: 'Ogni fatto qui sotto è stato proposto da uno dei tuoi documenti o dalle tue risposte. Leggilo accanto al suo passaggio: confermalo se il passaggio dice ciò che dice il fatto, riformulalo se le parole non vanno, rifiutalo se non è vero o non è tuo. I fatti rifiutati restano, non vengono mai cancellati.'
? Each run is Claude Code in print mode inside your data root, with file tools only; the result counts only if it validates. Approval of the CV and the letter stays on their page.
: Ogni esecuzione è Claude Code in modalità print dentro la tua cartella dati, con soli strumenti sui file; il risultato conta solo se valida. L'approvazione del CV e della lettera resta sulla loro pagina.
