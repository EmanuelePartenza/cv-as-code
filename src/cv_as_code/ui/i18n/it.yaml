# UI chrome, Italian. Keys are the English strings (ADR-0016).
'A master CV from your confirmed facts, then postings: match, tailored CV, letter, interview preparation, gap plan.': 'Un CV master dai tuoi fatti confermati, poi gli annunci: corrispondenza, CV su misura, lettera, preparazione al colloquio, piano per le lacune.'
? A posting enters verbatim as jobs/<id>/raw.txt; every step after that is a stage run by Claude and checked by the validator.
: Un annuncio entra così com'è in jobs/<id>/raw.txt; ogni passo successivo è uno stadio eseguito da Claude e controllato dal validatore.
Add a posting: Aggiungi un annuncio
Add another: 'Aggiungi un''altra voce:'
? Answer in your own words and language, as plainly as you like; "I do not know" is a valid answer. Save whenever you want and come back later. Nothing here reaches a CV before you have confirmed it, fact by fact.
: Rispondi con parole tue e nella tua lingua, in modo semplice; "non lo so" è una risposta valida. Salva quando vuoi e torna più tardi. Nulla di ciò che scrivi arriva in un CV prima che tu l'abbia confermato, fatto per fatto.
Apply to the profile (04): Applica al profilo (04)
? 'Applying a note is deterministic: its facts are appended to profile.yaml as draft, each pointing at its passage, and nothing else in the file moves; nothing becomes verified here.'
: 'Applicare una nota è deterministico: i suoi fatti vengono aggiunti a profile.yaml come bozze, ciascuno con il suo passaggio, e nient''altro nel file si muove; qui nulla diventa verificato.'
