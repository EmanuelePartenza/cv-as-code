  - {text: Experience coordinating with the coastguard or other emergency services, kind: must}
  - {text: "Working knowledge of a port management system (berth planning, vessel scheduling)", kind: must}
  - {text: Strong written reporting skills, kind: must}
  - {text: VTS operator certification, kind: nice}
