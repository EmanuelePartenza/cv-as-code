headline: Marine Operations Officer

summary:
  text: >-
    Marine operations professional with twelve years across a ferry deck and a
    remote lighthouse station. First point of contact for the coastguard on 14
    incidents since 2019; plans and runs supply landings, stores and a
    consumables budget; keeps a first-order light and its generator in service
    (six years without an unplanned outage). Reports daily, and built the
    telemetry export the Lights Board schedules its maintenance from.
  source_facts: [exp-fairhaven.f01, exp-skerra.f01, exp-skerra.f03, exp-skerra.f05, exp-skerra.f07, exp-skerra.f02, prj-fogsignal.f02]

sections: [summary, experience, projects, skills, education, languages]

experience:
  - ref: exp-skerra
    bullets:
      - text: >-
          Coordinated 14 incidents with the coastguard by VHF since 2019,
          including three helicopter medical evacuations — the station's first
          point of contact for emergency services.
        source_facts: [exp-skerra.f03]
      - text: >-
          Managed the station's stores and supplies: four supply landings a
          year planned end to end with the supply vessel's master, and a
          consumables and spares budget of about £40,000 a year.
        source_facts: [exp-skerra.f05, exp-skerra.f07]
      - text: >-
          Kept a first-order rotating light, its fog signal and the standby
          generator in service as sole keeper: six years without an unplanned
          outage (2018–2024).
        source_facts: [exp-skerra.f01, exp-skerra.f02]
      - text: >-
          Wrote the 40-page station handbook and trained five relief keepers on
          it; weather observations reported every three hours to the national
          meteorological service.
        source_facts: [exp-skerra.f06, exp-skerra.f04]
  - ref: exp-fairhaven
    bullets:
      - text: >-
          Deck crew on a 40-metre ro-ro ferry, six crossings a day; bosun's mate
          from 2016 with the deck department's daily checks; radio watch on the
          bridge with the GMDSS General Operator's Certificate (2014) and STCW
          basic safety training (2013, renewed 2018).
        source_facts: [exp-fairhaven.f01, exp-fairhaven.f02, exp-fairhaven.f03, exp-fairhaven.f04]
  - ref: prj-fogsignal
    title: Fog-signal logger
    subtitle: Telemetry for a lighthouse station · personal project
    bullets:
      - text: >-
          Raspberry Pi logger in Python with three years of continuous data on
          fog-signal activations and generator hours; the Lights Board's
          engineering office plans its maintenance visits from its monthly
          export.
        source_facts: [prj-fogsignal.f01, prj-fogsignal.f02]

