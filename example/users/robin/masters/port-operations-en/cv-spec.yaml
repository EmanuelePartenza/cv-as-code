headline: Marine Operations · Principal Lighthouse Keeper

summary:
  text: >-
    Eight years of marine operations across a ferry deck and a remote lighthouse
    station: sole keeper of a first-order light with six years without an
    unplanned outage, 14 coastguard incidents coordinated by radio, four supply
    landings a year planned end to end. Builds the tools the job lacks — a
    telemetry logger the Lights Board now schedules its maintenance from.
  source_facts: [exp-skerra.f01, exp-skerra.f02, exp-skerra.f03, exp-skerra.f05, prj-fogsignal.f02]

sections: [summary, experience, projects, skills, education, languages]

experience:
  - ref: exp-skerra
    bullets:
      - text: >-
          Sole keeper of a first-order rotating light and fog signal, on a rota
          with one relief keeper; six years without an unplanned outage of the
          light (2018–2024), maintaining the lens drive, lamp changer and
          standby generator myself.
        source_facts: [exp-skerra.f01, exp-skerra.f02]
      - text: >-
          Coordinated 14 incidents with the coastguard by VHF since 2019,
          including three helicopter medical evacuations.
        source_facts: [exp-skerra.f03]
      - text: >-
          Planned and managed four supply landings a year — inventory, ordering
          and the landing plan agreed with the supply vessel's master — and the
          station's consumables and spares budget of about £40,000 a year.
        source_facts: [exp-skerra.f05, exp-skerra.f07]
      - text: >-
          Trained five relief keepers and wrote the 40-page station handbook;
          weather observations every three hours for the national
          meteorological service.
        source_facts: [exp-skerra.f06, exp-skerra.f04]
  - ref: exp-fairhaven
    bullets:
      - text: >-
          Deck crew on a 40-metre ro-ro ferry, six crossings a day: mooring,
          cargo lashing, passenger safety briefings; bosun's mate from 2016,
          responsible for the deck department's daily checks.
        source_facts: [exp-fairhaven.f01, exp-fairhaven.f02]
      - text: >-
          Radio watch on the bridge; GMDSS General Operator's Certificate (2014),
          STCW basic safety training (2013, renewed 2018).
        source_facts: [exp-fairhaven.f03, exp-fairhaven.f04]
  - ref: prj-fogsignal
    title: Fog-signal logger
    subtitle: Telemetry for a lighthouse station · personal project
    bullets:
      - text: >-
          Raspberry Pi logger in Python recording fog-signal activations and
          generator running hours, three years of continuous data; the Lights
          Board's engineering office plans its maintenance visits from the
          monthly export.
        source_facts: [prj-fogsignal.f01, prj-fogsignal.f02]

